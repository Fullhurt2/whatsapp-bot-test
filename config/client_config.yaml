# =============================================================================
# НАСТРОЙКИ КЛИЕНТА
# =============================================================================

business_name: "Global Coffee Kazygurt"

tone: "вежливый, дружелюбный, на «вы»"

language: "auto"

# -----------------------------------------------------------------------------
# База знаний
# -----------------------------------------------------------------------------
knowledge_base: |
  Часы работы: ежедневно 08:00–00:00.
  Адрес: село Казыгурт, ул. Конаева 91.
  Телефон для доставки: 8771 603 65 19.

  Услуги и цены:
  - Кофе: Американо 900 ₸, Капучино 1200 ₸, Латте 1200 ₸, Раф 1500 ₸.
  - Холодные напитки: Айс-латте 1300 ₸, Лимонад маракуйя 1100 ₸, Бамбл 1400 ₸.
  - Еда и десерты: Сэндвич с курицей 1500 ₸, Круассан классический 800 ₸, Чизкейк 1400 ₸.
  - Сиропы: карамель, ваниль, кокос (+200 ₸).

  Доставка:
  - Доставка по Казыгурту стоит 500 ₸.
  - При заказе от 3000 ₸ — доставка бесплатно.
  - Среднее время доставки: 30-40 минут.

  Оплата:
  - Принимаем Kaspi Перевод, Kaspi QR и наличные курьеру.

  Частые вопросы:
  - Можно ли посидеть внутри? Да, у нас уютная кофейня, ждем в гости.

  Что нельзя обещать клиенту:
  - Не обещать бесплатную доставку, если сумма заказа меньше 3000 ₸.
  - Не называть точное время доставки, всегда отвечать: "Я передам ваш заказ администратору, он сориентирует по времени доставки".
  - Не придумывать позиции меню, которых нет в прайсе.

# WhatsApp-номер владельца (E.164, например +77770000000) — куда пересылать
# нестандартные вопросы ([HANDOFF], ключевые слова, таймаут LLM).
# Уведомление приходит владельцу сообщением от бизнес-номера через Bird.
# Для тестов можно перекрыть из .env: OWNER_WHATSAPP_NUMBER=+7...
owner_whatsapp_phone: "" 

# Ключевые слова, при которых диалог сразу передаётся владельцу
# (проверяется по вхождению в текст сообщения, без учёта регистра).
# Совет: только однозначные формулировки — «не понимаю» сюда не годится,
# оно ложно срабатывает на «я не понимаю русский» (просьба сменить язык).
fallback_triggers:
  - "жалоба"
  - "хочу человека"
  - "позови менеджера"
  - "админ"
  - "ошибка"
  - "неправильно"

# -----------------------------------------------------------------------------
# Примеры тёплого/дружеского ответа (few-shot). Модели подхватывают стиль
# по примерам лучше, чем по словесной инструкции «тон: дружеский» —
# 2-3 живых примера достаточно. Пишите в стиле своего клиента.
# -----------------------------------------------------------------------------
style_examples: |
  Клиент: «Салеметсіз бе, доставка бар ма?»
  Хороший ответ: «Сәлеметсіз бе! Иә, әрине, бізде жеткізу қызметі бар 🚗. Сізге мәзірді жіберейін бе?»

  Клиент: «До скольки работаете сегодня?»
  Хороший ответ: «Здравствуйте! Мы открыты каждый день с 08:00 до 00:00. Ждем ваших заказов ☕»

# -----------------------------------------------------------------------------
# Параметры LLM. Меняются без правки кода.
# -----------------------------------------------------------------------------
llm:
  # Пусто = берётся из .env (LLM_MODEL). Активно: gpt-6-luna (OpenAI)
  model: ""
  # Несколько моделей принимают только дефолтную temperature (=1) — при отказе
  # провайдера клиент сам повторит запрос без этого параметра.
  temperature: 1.0
  # Часть моделей тратит лимит на внутренний reasoning,
  # поэтому лимит должен быть с запасом относительно длины ответа.
  max_tokens: 3500
  # Секунды на ожидание ответа LLM; при превышении — fallback владельцу.
  timeout_seconds: 15
  # Уровень внутреннего рассуждения (gpt-6-luna принимает low/medium/high).
  # medium — баланс качества и цены для FAQ-бота.
  reasoning_effort: "medium"
  # Если reasoning всё же израсходует лимит и content придёт пустым,
  # клиент один раз повторит запрос с лимитом 5000 (см. services/llm_client.py).
