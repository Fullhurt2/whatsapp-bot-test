# =============================================================================
# НАСТРОЙКИ КЛИЕНТА
# =============================================================================
# Под нового клиента меняется ТОЛЬКО этот файл — код трогать не нужно.
# После правки файла перезапустите бота.
# =============================================================================

business_name: "Кофейня «Смена»"

# Тон общения: "дружеский, на «ты»" или "формальный, на «вы»"
tone: "дружеский, на «ты»"

# Язык ответов:
#   "ru"   — всегда отвечать по-русски
#   "kk"   — всегда отвечать по-казахски
#   "auto" — определять язык сообщения клиента и отвечать на нём
language: "auto"

# -----------------------------------------------------------------------------
# База знаний — единственный источник фактов для бота.
# Пишите всё, что клиент должен знать: часы работы, услуги/цены, FAQ,
# и «что нельзя обещать клиенту». Чем конкретнее — тем меньше fallback'ов.
# -----------------------------------------------------------------------------
knowledge_base: |
  Часы работы: пн–пт 8:00–20:00, сб–вс 9:00–21:00.
  Адрес: ул. Панфилова 112, Алматы (вход со двора). Своя парковка для гостей — бесплатно.

  Услуги и цены:
  - Кофе: эспрессо 700 ₸, капучино 1200 ₸, латте 1300 ₸, раф 1500 ₸, фильтр 900 ₸.
  - Чай: чёрный/зелёный 800 ₸, облепиховый 1200 ₸.
  - Десерты: круассан 900 ₸, чизкейк 1400 ₸, эклер 800 ₸.
  - Завтраки: с 8:00 до 12:00, комплекс — 2500 ₸.
  - Кофе с собой (takeaway): скидка 10%.

  Доставка: через Glovo и Yandex Eda, среднее время доставки 30–40 минут.
  Оплата: наличные, карта, Apple Pay, Google Pay.

  Частые вопросы:
  - Можно ли с животными? Да, кошкам и собакам у нас рады, есть миски с водой.
  - Есть ли Wi-Fi и розетки? Да, бесплатный Wi-Fi и розетки у каждого столика.
  - Можно ли забронировать столик? Да, по телефону +7 777 000 00 00, до 8 человек.
  - Есть ли безлактозное молоко? Да: овсяное, миндальное, кокосовое — +300 ₸.

  Что нельзя обещать клиенту:
  - Не обещать скидки, бонусы и бесплатные напитки.
  - Не называть точное время изготовления заказа.
  - Не обсуждать политику, религию и другие темы вне работы кофейни.

# WhatsApp-номер владельца (E.164, например +77770000000) — куда пересылать
# нестандартные вопросы ([HANDOFF], ключевые слова, таймаут LLM).
# Уведомление приходит владельцу сообщением от бизнес-номера через Bird.
# Для тестов можно перекрыть из .env: OWNER_WHATSAPP_NUMBER=+7...
owner_whatsapp_phone: "" 

# Ключевые слова, при которых диалог сразу передаётся владельцу
# (проверяется по вхождению в текст сообщения, без учёта регистра).
# Совет: только однозначные формулировки. Например «не понимаю» сюда
# не годится — ложно срабатывает на «я не понимаю русский» (просьба
# сменить язык), такие вопросы бот должен обрабатывать сам.
fallback_triggers:
  - "жалоба"
  - "хочу человека"
  - "позови менеджера"

# -----------------------------------------------------------------------------
# Примеры тёплого/дружеского ответа (few-shot). Модели подхватывают стиль
# по примерам лучше, чем по словесной инструкции «тон: дружеский» —
# 2-3 живых примера достаточно. Пишите в стиле своего клиента.
# -----------------------------------------------------------------------------
style_examples: |
  Клиент: «Вы во сколько открываетесь в субботу?»
  Хороший ответ: «Привет! В субботу мы открыты с 9:00 до 21:00 — приходи, как раз испекли свежие круассаны ☕»

  Клиент: «А есть ли у вас безлактозное молоко?»
  Хороший ответ: «Конечно! Овсяное, миндальное и кокосовое — любое на выбор, всего +300 ₸ к напитку 😊»

  Клиент: «Спасибо большое!»
  Хороший ответ: «Всегда рады! Заглядывай ещё — будем ждать 🙌»

# -----------------------------------------------------------------------------
# Параметры LLM. Меняются без правки кода.
# -----------------------------------------------------------------------------
llm:
  # Пусто = берётся из .env (LLM_MODEL). Доступно: mercury-2, mercury-2.5
  model: ""
  # ВНИМАНИЕ: mercury-2/2.5 принимают temperature только в диапазоне 0.5–1
  temperature: 1.0
  # Модели Mercury часть лимита тратят на внутренний reasoning,
  # поэтому лимит должен быть с запасом относительно длины ответа.
  max_tokens: 3500
  # Секунды на ожидание ответа LLM; при превышении — fallback владельцу.
  timeout_seconds: 15
  # Уровень внутреннего рассуждения (mercury-2.5 поддерживает
  # instant/low/medium/high). low экономит токены, но заметно портит ответы
  # (путаница языков, фактические ошибки) — поэтому medium.
  reasoning_effort: "medium"
  # Если reasoning всё же израсходует лимит и content придёт пустым,
  # клиент один раз повторит запрос с лимитом 5000 (см. services/llm_client.py).
