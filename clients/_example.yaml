# =============================================================================
# ОБРАЗЕЦ КОНФИГА КЛИЕНТА (мультитенант)
# =============================================================================
# Один файл на клиента. ИМЯ ФАЙЛА = ключ клиента:
#   - provider: zernio — произвольный slug, например clients/nails-studio.yaml;
#   - provider: wa (Meta) — phone_number_id бизнес-номера в Graph API,
#     например clients/1354249714436396.yaml (только цифры);
#   - provider: tg — id бота из токена, например clients/123456789.yaml (цифры).
# Новый клиент = новый файл в этой папке — бот подхватит его без рестарта
# (hot-reload). Через панель /admin платформу (wa/zernio/tg) выбирают
# переключателем при создании клиента.
#
# СЕКРЕТЫ: access_token (wa) и telegram_bot_token (tg) храните только в
# локальном (не закоммиченном) файле — папка clients/ в .gitignore целиком,
# кроме _example.yaml. Если access_token пустой, используется глобальный
# WHATSAPP_ACCESS_TOKEN из env (случай «все номера под партнёрством и одним
# токеном»); у Telegram глобального токена нет — он свой у каждого бота.
# У Zernio ключ один на всю команду (ZERNIO_API_KEY в .env), а в yaml —
# только accountId подключённого аккаунта.

# Платформа клиента: "zernio" — WhatsApp через Zernio, "wa" — Meta Cloud API,
# "tg" — Telegram. Не задано = "wa".
provider: "zernio"

# Id подключённого WhatsApp-аккаунта в Zernio (24 hex-символа). Ключ
# маршрутизации входящих вебхуков. До подключения номера поле можно оставить
# пустым: создайте клиента, откройте его в панели и нажмите «Сгенерировать
# ссылку подключения», затем «Проверить и сохранить» — accountId подставится
# сам. Смотреть в дашборде Zernio (GET /v1/accounts -> _id).
zernio_account_id: ""

# (необязательно) Id профиля Zernio — группы, в которую входит аккаунт. Пишет
# scripts/zernio_connect.py при выдаче ссылки Embedded Signup; на работу бота
# не влияет, нужен только чтобы повторно выдать ссылку тому же клиенту.
zernio_profile_id: ""

# Название бизнеса — попадает в system prompt и служебные ответы.
business_name: "Пример Бизнеса"

# Тон общения бота.
tone: "вежливый, дружелюбный, на «вы»"

# Язык ответов: ru / kk / auto (определять по сообщению клиента).
language: "auto"

# База знаний — единственный источник фактов для ответов LLM.
knowledge_base: |
  Часы работы: ежедневно 10:00–20:00.
  Услуги и цены:
  - Услуга 1: 3000 ₸
  - Услуга 2: 4500 ₸

# WhatsApp-номер владельца (E.164, например +77770000000) — куда пересылать
# нестандартные вопросы ([HANDOFF], ключевые слова, таймаут LLM).
# Используется у provider: wa и zernio. Не задан -> уведомления пропускаются.
owner_whatsapp_phone: ""

# Telegram chat id владельца (числовой, например 123456789; узнать у бота
# @userinfobot) — используется только у provider: tg.
owner_telegram_chat_id: ""

# Уведомление владельцу шаблоном — только для provider: zernio.
# Вне 24-часового окна WhatsApp свободный текст запрещён, поэтому уведомление
# уходит approved-шаблоном с двумя переменными тела: {{1}} — отправитель,
# {{2}} — сообщение. Имя и язык — из дашборда шаблонов Zernio/Meta.
owner_template_name: ""
owner_template_language: ""

# Ключевые слова, при которых бот сразу передаёт диалог владельцу.
fallback_triggers:
  - "жалоб"
  - "отмен"
  - "предоплат"

# Примеры тёплого ответа (few-shot) — необязательно.
style_examples: |
  Клиент: «Сколько стоит услуга?»
  Хороший ответ: «Услуга — 3000 ₸. Подсказать свободное время? 😊»

# Параметры LLM. Пустое поле model = глобальный LLM_MODEL из .env.
llm:
  model: ""
  temperature: 0.6
  max_tokens: 3500
  timeout_seconds: 15
  reasoning_effort: ""

# ТОКЕН ЭТОЙ WABA (System User с доступом к WhatsApp Account клиента).
# Только для provider: wa. Оставьте пустым, чтобы использовать глобальный
# WHATSAPP_ACCESS_TOKEN из env.
access_token: ""

# Токен Telegram-бота от @BotFather (формат 123456789:AA…).
# Только для provider: tg; имя файла должно совпадать с id бота из токена.
# Секрет вебхука (telegram_webhook_secret) сервер генерирует сам при сохранении.
telegram_bot_token: ""

# Персональный токен клиента для панели /admin (правит только свой конфиг
# и только бизнес-поля). Сгенерируйте сами, например:
#   python -c "import secrets; print(secrets.token_urlsafe(24))"
# Пусто = клиенту недоступна панель.
management_token: ""

# Служебные ответы (необязательно; пусто = встроенные тексты, ru/kk).
fallback_reply_ru: ""
fallback_reply_kk: ""
timeout_reply_ru: ""
timeout_reply_kk: ""
